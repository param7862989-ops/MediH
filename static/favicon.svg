<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Medical Cyan to Surgical Cobalt Gradient -->
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Glow & Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.1)" />
    </linearGradient>
  </defs>

  <!-- App Rounded Container Box -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Shield Haven Motif -->
  <path d="M 160 176 
           C 160 176 220 156 256 140 
           C 292 156 352 176 352 176 
           V 284 
           C 352 352 296 396 256 414 
           C 216 396 160 352 160 284 
           Z" 
        fill="none" 
        stroke="url(#medGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Medical Cross on Crest -->
  <g fill="url(#medGrad)" filter="url(#softGlow)">
    <!-- Horizontal Cross Bar -->
    <rect x="220" y="112" width="72" height="24" rx="10" />
    <!-- Vertical Cross Bar -->
    <rect x="244" y="88" width="24" height="72" rx="10" />
  </g>

  <!-- Continuous ECG Vitals Pulse Wave -->
  <path d="M 124 300 
           L 204 300 
           L 224 246 
           L 248 356 
           L 276 228 
           L 300 324 
           L 320 300 
           L 388 300" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Central Pulse Indicator Beacon -->
  <circle cx="276" cy="228" r="9" fill="#E0F2FE" />
</svg>
